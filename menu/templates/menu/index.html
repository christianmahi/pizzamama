{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'menu/style.css' %}">
    <title>Menu des pizzas</title>
</head>
<body>
    <a href="{% url 'main:index' %}">
        <img id="small_logo" src="{% static 'menu/images/small_logo.png' %}" alt="Logo Pizza Mama">
    </a>

    <div class="menu_title">
        <h1>Les pizzas</h1>
    </div>

    <div class="menu_liste">
        {% for pizza in pizzas %}
            <div class="menu_liste_item">
                <span class="menu_liste_title">{{ pizza.nom }}</span>
                <span class="menu_liste_prix">{{ pizza.prix|floatformat:2 }} €</span>
                <span class="menu_liste_ingredients">{{ pizza.ingredients }}</span>

                {% if pizza.vegetarienne %}
                    <span class="menu_liste_vegetarienne">VÉGÉTARIENNE</span>
                {% endif %}
            </div>
        {% empty %}
            <p>Aucune pizza disponible pour le moment.</p>
        {% endfor %}
    </div>
</body>
</html>
